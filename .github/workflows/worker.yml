name: Platform Worker
on:
  schedule:
    - cron: "18 */6 * * *"
  workflow_dispatch: {}

env:
  PYFUNCEBLE_AUTO_CONFIGURATION: "YES"
  GIT_NAME: "${{ secrets.GIT_BOT_NAME }}"
  GIT_EMAIL: "${{ secrets.GIT_BOT_EMAIL }}"
  GIT_BRANCH: "worker"
  GIT_DISTRIBUTION_BRANCH: "worker"
  PYFUNCEBLE_CONFIG_DIR: "${{ github.workspace }}/.pyfunceble"
  GITHUB_TOKEN: "${{ secrets.BOT_REPO_PAT }}"
  PLATFORM_API_URL: "${{ secrets.PLATFORM_API_URL }}"
  PLATFORM_API_TOKEN: "${{ secrets.PLATFORM_API_TOKEN }}"
  PLATFORM_SCOPE: "${{ secrets.PLATFORM_SCOPE }}"
  PLATFORM_WORKER: "yes"
  PYFUNCEBLE_PLATFORM_API_TOKEN: "${{ secrets.PLATFORM_WORKER_TOKEN }}"

jobs:
  trigger:
    name: Trigger action
    runs-on: "${{ matrix.os }}"

    strategy:
      fail-fast: false
      matrix:
        python_version:
          - "3.11"
        os:
          - ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        name: Clone repository
        with:
          token: "${{ secrets.BOT_REPO_PAT }}"

      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install dependencies
        run: |
          pip install dead-hosts-launcher

      # WORKAROUND 2026-10: the upstream PyFunceble/user_agents generator is
      # broken and ships an empty dataset ("@modern": {}), which makes any
      # PyFunceble command fail with
      #   ValueError: The given name ('chrome') or platform ('linux') is not supported.
      # We restore the last known-good dataset (commit 4afb1fc, Oct 3 2026)
      # into PyFunceble's cache before running anything.
      # TODO: remove once https://github.com/PyFunceble/user_agents is fixed
      # (watch for "Generation of the User-Agents file" runs to succeed again).
      - name: Restore last known-good PyFunceble user_agents dataset
        run: |
          mkdir -p ~/.config/PyFunceble
          curl -fsSL \
            "https://raw.githubusercontent.com/PyFunceble/user_agents/4afb1fc68b0e8ed229b29e1d70c58f638ade8b5f/user_agents.json" \
            -o ~/.config/PyFunceble/user_agents.json
          cat ~/.config/PyFunceble/user_agents.json | python -c "import json,sys; d=json.load(sys.stdin); assert d['chrome']['linux'], 'dataset still empty'"

      - name: Get PyFunceble version
        run: |
          PyFunceble --version

      - name: Get Launcher version
        run: |
          dead-hosts-launcher --version

      - name: Run Launcher
        run: |
          dead-hosts-launcher
